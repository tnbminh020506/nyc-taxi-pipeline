name: Ingestion checks

on:
  push:
    branches: [demo/ingestion]
  pull_request:
    paths:
      - 'src/nyc_taxi_pipeline/ingestion/**'
      - 'scripts/*ingestion*'
      - 'scripts/replay_taxi_stream.py'
      - 'tests/**'
      - 'configs/**'
      - 'data/fixtures/**'
      - '*requirements*.txt'
      - 'pytest.ini'
      - '.github/workflows/ingestion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: '*requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -m 'not kafka'
      - run: python scripts/run_ingestion.py --config configs/fixture.yaml
      - run: python scripts/replay_taxi_stream.py --config configs/fixture.yaml --dry-run --output output/events.jsonl

  kafka-roundtrip:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:4.1.2
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s --health-timeout 10s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -m kafka
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
