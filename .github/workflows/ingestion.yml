name: Ingestion checks

on:
  push:
    branches: [demo/ingestion]
  pull_request:
    paths:
      - 'src/nyc_taxi_pipeline/ingestion/**'
      - 'scripts/*ingestion*'
      - 'scripts/replay_taxi_stream.py'
      - 'tests/**'
      - 'configs/**'
      - 'data/fixtures/**'
      - '*requirements*.txt'
      - 'pytest.ini'
      - '.github/workflows/ingestion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: '*requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -m 'not kafka'
      - run: python scripts/run_ingestion.py --config configs/fixture.yaml
      - run: python scripts/replay_taxi_stream.py --config configs/fixture.yaml --dry-run --output output/events.jsonl

  kafka-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: docker compose -f docker-compose.ingestion.yml up -d --wait --wait-timeout 180
      - run: python -m pytest -q -m kafka
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      - if: failure()
        run: docker compose -f docker-compose.ingestion.yml logs
      - if: always()
        run: docker compose -f docker-compose.ingestion.yml down
