name: Ingestion checks

on:
  push:
    branches: [demo/ingestion]
  pull_request:
    paths:
      - 'src/nyc_taxi_pipeline/ingestion/**'
      - 'scripts/*ingestion*'
      - 'scripts/replay_taxi_stream.py'
      - 'scripts/benchmark_tlc.py'
      - 'scripts/test_hdfs_pipeline.py'
      - 'tests/**'
      - 'configs/**'
      - 'data/fixtures/**'
      - '*requirements*.txt'
      - 'pytest.ini'
      - 'docker-compose.ingestion.yml'
      - 'docker-compose.hdfs.yml'
      - '.github/workflows/ingestion.yml'
  workflow_dispatch:
    inputs:
      run_live_tlc:
        description: 'Explicitly allow TLC HTTPS traffic (ordinary CI uses local test data only)'
        type: boolean
        default: false
      months:
        description: 'Number of actual TLC months to materialize and independently validate'
        type: choice
        options: ['2', '12']
        default: '2'

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: '*requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -m 'not kafka'
      - run: python scripts/run_ingestion.py --config configs/fixture.yaml
      - run: python scripts/replay_taxi_stream.py --config configs/fixture.yaml --dry-run --output output/events.jsonl

  kafka-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: docker compose -f docker-compose.ingestion.yml up -d --wait --wait-timeout 180
      - run: python -m pytest -q -m kafka
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      - if: failure()
        run: docker compose -f docker-compose.ingestion.yml logs
      - if: always()
        run: docker compose -f docker-compose.ingestion.yml down

  tlc-live-volume:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_tlc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/benchmark_tlc.py --source-mode remote --months ${{ inputs.months || '2' }} --large-repeats 1 --small-repeats 0 --report output/tlc-ci-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tlc-live-volume-evidence
          path: output/tlc-ci-report.json

  hdfs-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: docker compose -p taxi-hdfs -f docker-compose.hdfs.yml up -d --wait --wait-timeout 240
      - run: docker compose -p taxi-kafka-hdfs -f docker-compose.ingestion.yml up -d --wait --wait-timeout 180
      - run: python scripts/test_hdfs_pipeline.py --rows 1000000 --fault-test --report output/hdfs-acceptance/report.json
      - if: failure()
        run: docker compose -p taxi-hdfs -f docker-compose.hdfs.yml logs --tail 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdfs-acceptance-evidence
          path: output/hdfs-acceptance/report.json
      - if: always()
        run: docker compose -p taxi-kafka-hdfs -f docker-compose.ingestion.yml down
      - if: always()
        run: docker compose -p taxi-hdfs -f docker-compose.hdfs.yml down
