name: Live NYC API acceptance

on:
  workflow_dispatch:
    inputs:
      api_version:
        description: 'Explicit API version (v3 requires repository secret SOCRATA_APP_TOKEN)'
        type: choice
        options: ['2', '3']
        default: '2'

permissions:
  contents: read

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-ingestion.txt
      - name: Fetch and verify real NYC data
        run: python scripts/test_live_api.py --api-version "$API_VERSION"
        env:
          API_VERSION: ${{ inputs.api_version || '2' }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      - name: Save raw pages, Parquet, manifest and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-api-v${{ inputs.api_version || '2' }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            output/api-smoke/
            data/raw/api-smoke/
            data/processed/api-smoke/
            data/api-smoke-manifest.json
          retention-days: 7
