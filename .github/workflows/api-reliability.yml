name: NYC API reliability

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 'Probe rounds (8 serial v2 requests per round, no automatic retries)'
        default: '5'
      mode:
        description: 'Diagnostic probes or 20 fresh acceptance runs (4 sequential batches)'
        type: choice
        options: ['acceptance', 'probe']
        default: 'acceptance'
      comparison:
        description: 'Diagnostic probe comparison'
        type: choice
        options: ['query', 'connection']
        default: 'query'

permissions:
  contents: read

jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-ingestion.txt
      - run: python scripts/probe_api_reliability.py --rounds "$ROUNDS" --comparison "$COMPARISON"
        env:
          ROUNDS: ${{ inputs.rounds || '5' }}
          COMPARISON: ${{ inputs.comparison || 'query' }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-reliability-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/api-reliability/
          retention-days: 14

  acceptance:
    if: github.event_name == 'push' || inputs.mode == 'acceptance'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-ingestion.txt
      - run: python scripts/measure_pipeline_reliability.py --rounds 5 --start-index "$START" --total-rounds 20
        env:
          START: ${{ matrix.batch == 0 && '0' || matrix.batch == 1 && '5' || matrix.batch == 2 && '10' || '15' }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-acceptance-${{ matrix.batch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/api-reliability/
          retention-days: 14
