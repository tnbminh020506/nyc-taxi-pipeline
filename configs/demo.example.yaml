# Bước 1.1 và 4.1–4.2 | Nhóm trưởng cùng Chính, Mạnh và Bảo | Cấu hình dùng chung.
#
# Đầu vào
# - NYC Open Data API, dataset Yellow Taxi 2025 đề xuất irx2-vgm4.
# - Endpoint SODA v3 dự kiến https://data.cityofnewyork.us/api/v3/views/irx2-vgm4/query.json.
# - Biến môi trường chứa app token cho SODA v3, kích thước trang và giới hạn lượt lấy.
# - Trường API tpep_pickup_datetime và pulocationid, cùng ánh xạ sang schema Parquet đã chốt.
# - URL hoặc đường dẫn CSV Taxi Zone Lookup. Đây là nguồn tra cứu riêng.
# - Hai kỳ history/replay không giao nhau và danh sách cửa sổ đã xác nhận độ phủ.
# - Đường dẫn dùng chung cho JSON gốc, Parquet tạo từ API, manifest, kết quả batch và checkpoint.
# - Định dạng kết quả batch và cách kết nối phần ghi stream do Mạnh và Bảo thống nhất.
# - Kafka bootstrap servers, topic taxi-events, replay_id và tốc độ phát.
# - Cấu hình Spark gồm nhịp trigger và cửa sổ 15 phút. Múi giờ nghiệp vụ America/New_York.
# - Tham chiếu biến môi trường chứa chuỗi kết nối PostgreSQL.
#
# Đầu ra
# - Một bộ thông số thống nhất cho ingestion, Spark và kho. Các mốc trao đổi có múi giờ.
# - Mỗi phiên có checkpoint riêng và các vị trí bàn giao mà tiến trình nhận đọc được.

# Khoảng thời gian minh họa, cần nhóm trưởng xác nhận trước lượt demo chính thức.
workspace_root: ..
source_timezone: America/New_York
api:
  version: 3
  dataset_id: irx2-vgm4
  endpoint: https://data.cityofnewyork.us/api/v3/views/irx2-vgm4/query.json
  app_token_env: SOCRATA_APP_TOKEN
  page_size: 1000
  max_pages: 100
  timeout_seconds: 30
datasets:
  history:
    range_start: '2025-01-06T08:00:00-05:00'
    range_end: '2025-01-13T08:30:00-05:00'
  replay:
    range_start: '2025-01-20T08:00:00-05:00'
    range_end: '2025-01-20T08:30:00-05:00'
zone_lookup:
  source_id: taxi-zone-lookup
  source: https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv
paths:
  raw: data/raw
  parquet: data/processed
  manifest: data/manifest.json
kafka:
  bootstrap_servers: localhost:9092
  topic: taxi-events
  partitions: 1
replay:
  replay_id: taxi-demo-001
  events_per_second: 10  # 0 = không giới hạn tốc độ
