# Recommended distributed handoff. Cache original TLC + lookup once before running.
workspace_root: ..
source_timezone: America/New_York
source:
  kind: tlc_parquet
  source_id: tlc-yellow-taxi
  cache_directory: output/tlc-source-cache
  files:
    '2025-01': output/tlc-source-cache/yellow_tripdata_2025-01.parquet
datasets:
  history:
    range_start: '2025-01-06T08:00:00-05:00'
    range_end: '2025-01-06T10:00:00-05:00'
  replay:
    range_start: '2025-01-20T08:00:00-05:00'
    range_end: '2025-01-20T10:00:00-05:00'
zone_lookup:
  source_id: taxi-zone-lookup
  source: output/tlc-source-cache/taxi_zone_lookup.csv
paths:
  raw: data/raw/hdfs-staging
  parquet: data/processed/hdfs-staging
  manifest: data/hdfs-staging-manifest.json
storage:
  kind: hdfs
  fs_uri: hdfs://namenode:8020
  webhdfs_url: http://127.0.0.1:9870
  root: /nyc-taxi
  user: hadoop
  replication: 2
  replication_wait_seconds: 60
  timeout_seconds: 60
  receipt: data/hdfs-publication.local.json
  replay_cache: output/hdfs-replay-cache
  data_node_map:
    'datanode-1:9864': http://127.0.0.1:9864
    'datanode-2:9865': http://127.0.0.1:9865
duckdb:
  memory_limit: 512MB
  threads: 2
  temp_directory: output/duckdb-temp
  max_temp_directory_size: 8GB
kafka:
  bootstrap_servers: localhost:9092
  topic: taxi-events
  partitions: 1
replay:
  replay_id: tlc-hdfs-3-2-001
  events_per_second: 100
