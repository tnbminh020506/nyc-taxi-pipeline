# Kiểm tra API thật trên hai khoảng nhỏ; không dùng làm kỳ baseline của demo.
# Chọn v2 công khai tường minh vì chưa có token. Default demo vẫn là v3.
workspace_root: ..
source_timezone: America/New_York
api:
  version: 2
  dataset_id: irx2-vgm4
  endpoint: https://data.cityofnewyork.us/resource/irx2-vgm4.json
  app_token_env: SOCRATA_APP_TOKEN
  page_size: 100
  max_pages: 20
  timeout_seconds: 60
  max_retries: 5
  retry_backoff_seconds: 2
  retry_backoff_max_seconds: 20
datasets:
  history:
    range_start: '2025-01-06T08:00:00-05:00'
    range_end: '2025-01-06T08:01:00-05:00'
  replay:
    range_start: '2025-01-20T08:00:00-05:00'
    range_end: '2025-01-20T08:01:00-05:00'
zone_lookup:
  source_id: taxi-zone-lookup
  source: https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv
paths:
  raw: data/raw/api-smoke
  parquet: data/processed/api-smoke
  manifest: data/api-smoke-manifest.json
kafka:
  bootstrap_servers: localhost:9092
  topic: taxi-events
  partitions: 1
replay:
  replay_id: taxi-api-smoke-001
  events_per_second: 0
